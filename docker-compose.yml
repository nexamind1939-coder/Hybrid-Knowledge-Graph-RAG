services:
  backend:
    build:
      context: ./backend
    container_name: rag_backend
    env_file:
      - .env
    environment:
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: rag_frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
